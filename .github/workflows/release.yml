name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag, main ancestry, version and notes
        run: node scripts/release-check.cjs source
      - run: npm ci
      - run: npm test
      - name: Build from checked-out tag without publishing
        run: npx electron-builder --win --x64 --publish never
      - name: Inspect package and generate checksums and provenance
        run: node scripts/release-check.cjs artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-x64
          path: |
            dist/CapriGPT-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-windows-x64
          path: release-assets
      - name: Create draft only; refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          # List must succeed; API/auth failure is not treated as an absent release.
          existing=$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          test -z "$existing" || { echo 'Release already exists; inspect it manually.'; exit 1; }
          args=(--draft --verify-tag --title "CapriGPT $TAG · Windows x64" --notes-file "releases/$TAG.md")
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release-assets/* "${args[@]}"
